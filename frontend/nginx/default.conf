server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # A fresh nonce per response: Angular reads it from <app-root ngCspNonce> and stamps it on
    # the <style>/<script> tags, so the CSP needs no 'unsafe-inline'.
    sub_filter_once off;
    sub_filter 'CSP_NONCE' '$request_id';

    # Same origin for UI and API: no CORS needed in this deployment.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change: cache for a year.
    location ~* \.(?:js|css|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and every client-side route) must always be fresh.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
