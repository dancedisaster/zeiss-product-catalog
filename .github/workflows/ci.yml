# Every push to main and every pull request: the same checks a reviewer would run by hand (README, "Tests").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · format, build, unit + integration + BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format whitespace ProductCatalog.slnx --verify-no-changes --no-restore

      # TreatWarningsAsErrors and EnforceCodeStyleInBuild (Directory.Build.props) make this the analyzer check too.
      - name: Build
        run: dotnet build ProductCatalog.slnx --no-restore --configuration Release

      # The integration and BDD tests start SQL Server 2022 in Docker (Testcontainers); the runner has Docker.
      - name: Test
        run: dotnet test ProductCatalog.slnx --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend · format, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Test
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

  quick-start:
    name: Quick start · docker compose up, then API, UI and export respond
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: docker compose up --build
        run: docker compose up --build --detach

      - name: Wait until the API is ready (migrated and seeded)
        run: |
          for attempt in $(seq 1 60); do
            curl --silent --fail http://localhost:5080/health/ready && exit 0
            sleep 3
          done
          echo "The API did not become ready." && exit 1

      - name: Smoke test through nginx, as a browser would
        run: |
          set -euo pipefail
          curl --silent --fail http://localhost:4200/ | grep --quiet '<app-root'
          products=$(curl --silent --fail http://localhost:4200/api/products | jq length)
          echo "Products: $products"
          test "$products" -eq 12
          curl --silent --fail --dump-header - --output /dev/null http://localhost:4200/api/products/export \
            | grep --ignore-case --quiet 'content-type: text/csv'
          curl --silent --fail --output /dev/null http://localhost:5080/scalar/

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: docker compose down
        if: always()
        run: docker compose down --volumes
