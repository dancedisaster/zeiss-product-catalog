# Local environment: SQL Server + API + Angular (nginx). Run: docker compose up --build
# Then open http://localhost:4200 (UI) and http://localhost:5080/scalar (API reference).
# A host port already taken? Override it, e.g. UI_PORT=4300 API_PORT=5090 SQLSERVER_PORT=14331 docker compose up --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Passw0rd!}
    ports:
      # The stack itself reaches SQL Server over the Docker network; this port is only for running the API on the
      # host (README, "Running locally") and for looking at the data with SSMS. Not 1433: a SQL Server installed on
      # the machine usually holds that port already, and the container could not start.
      - "${SQLSERVER_PORT:-14330}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      # Development only to expose the API reference locally; never use the sa account outside a laptop.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ProductCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Passw0rd!};TrustServerCertificate=True;Encrypt=True"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedSampleData: "true"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      # Only nginx (fixed address below) may tell the API who the client is via X-Forwarded-For.
      ForwardedHeaders__KnownProxies__0: "172.28.10.10"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${UI_PORT:-4200}:8080"
    networks:
      default:
        ipv4_address: 172.28.10.10
    depends_on:
      - api

# Fixed subnet so the proxy has a known address the API can trust.
# Other containers get addresses from ip_range only, so none of them can ever be handed the proxy's.
# If it overlaps with a network you already have, change the addresses here and above.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.10.0/24
          ip_range: 172.28.10.128/25
